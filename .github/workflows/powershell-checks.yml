name: PowerShell checks and installer
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assistente-it-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-powershell:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse PowerShell and run isolated tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Get-ChildItem ./tests/*.Tests.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host ('TEST: ' + $_.Name)
            & $_.FullName
            if (-not $?) { throw ('Failed: ' + $_.Name) }
          }
  build-installer:
    needs: windows-powershell
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned NSIS compiler
        shell: powershell
        run: |
          ./build/Install-Nsis.ps1
      - name: Build installer and test installation lifecycle
        id: build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $current = & ./build/Build-AssistenteIT.ps1
          $baselineDirectory = Join-Path $PWD 'output/assistente-it/baseline'
          [void][IO.Directory]::CreateDirectory($baselineDirectory)
          gh release download v1.0.0 --repo $env:GITHUB_REPOSITORY --pattern 'OPBG-IT-Suite-Setup-1.0.0.exe' --pattern 'OPBG-IT-Suite-1.0.0-SHA256.txt' --dir $baselineDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed.' }
          $baselineSetup = Join-Path $baselineDirectory 'OPBG-IT-Suite-Setup-1.0.0.exe'
          $baselineChecksum = Join-Path $baselineDirectory 'OPBG-IT-Suite-1.0.0-SHA256.txt'
          $expected = ((Get-Content -LiteralPath $baselineChecksum -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $baselineSetup -Algorithm SHA256).Hash -ne $expected) { throw 'Previous release checksum mismatch.' }
          gh release download v1.0.1 --repo $env:GITHUB_REPOSITORY --pattern 'Assistente-IT-Setup-1.0.1.exe' --pattern 'Assistente-IT-1.0.1-SHA256.txt' --dir $baselineDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Release 1.0.1 download failed.' }
          $previousSetup = Join-Path $baselineDirectory 'Assistente-IT-Setup-1.0.1.exe'
          $previousChecksum = Join-Path $baselineDirectory 'Assistente-IT-1.0.1-SHA256.txt'
          $expected = ((Get-Content -LiteralPath $previousChecksum -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $previousSetup -Algorithm SHA256).Hash -ne $expected) { throw 'Release 1.0.1 checksum mismatch.' }
          gh release download v1.0.7 --repo $env:GITHUB_REPOSITORY --pattern 'Assistente-IT-Setup-1.0.7.exe' --pattern 'Assistente-IT-1.0.7-SHA256.txt' --dir $baselineDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Release 1.0.7 download failed.' }
          $otaPrevious = Join-Path $baselineDirectory 'Assistente-IT-Setup-1.0.7.exe'
          $otaChecksum = Join-Path $baselineDirectory 'Assistente-IT-1.0.7-SHA256.txt'
          $expected = ((Get-Content -LiteralPath $otaChecksum -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $otaPrevious -Algorithm SHA256).Hash -ne $expected) { throw 'Release 1.0.7 checksum mismatch.' }
          & ./build/Test-Installer.ps1 -SetupPath $current.SetupPath -BaselineSetupPath $baselineSetup -PreviousSetupPath $previousSetup -OtaPreviousSetupPath $otaPrevious
          if (-not $?) { throw 'Installer lifecycle test failed.' }
          'version=' + $current.Version | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistente-it-installer-${{ github.sha }}
          path: |
            output/assistente-it/Assistente-IT-Setup-${{ steps.build.outputs.version }}.exe
            output/assistente-it/Assistente-IT-${{ steps.build.outputs.version }}-SHA256.txt
            output/assistente-it/update.json
          if-no-files-found: error
          retention-days: 14
  publish-release:
    needs: build-installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assistente-it-installer-${{ github.sha }}
          path: release-assets
      - name: Publish a new version after successful tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/Publish-Release.ps1 -AssetDirectory ./release-assets
