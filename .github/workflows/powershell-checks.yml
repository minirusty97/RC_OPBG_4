name: PowerShell checks and installer
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-powershell:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse PowerShell and run isolated tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Get-ChildItem ./tests/*.Tests.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host ('TEST: ' + $_.Name)
            & $_.FullName
            if (-not $?) { throw ('Failed: ' + $_.Name) }
          }
  build-installer:
    needs: windows-powershell
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned NSIS compiler
        shell: powershell
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build installer and test installation lifecycle
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $current = & ./build/Build-Suite.ps1
          $baseline = & ./build/Build-Suite.ps1 -Version '0.9.0'
          & ./build/Test-Installer.ps1 -SetupPath $current.SetupPath -BaselineSetupPath $baseline.SetupPath
          if (-not $?) { throw 'Installer lifecycle test failed.' }
          'version=' + $current.Version | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suite-installer-${{ github.sha }}
          path: |
            output/suite/OPBG-IT-Suite-Setup-${{ steps.build.outputs.version }}.exe
            output/suite/OPBG-IT-Suite-${{ steps.build.outputs.version }}-SHA256.txt
          if-no-files-found: error
          retention-days: 14
  publish-release:
    needs: build-installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: suite-installer-${{ github.sha }}
          path: release-assets
      - name: Publish a new version after successful tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/Publish-Release.ps1 -AssetDirectory ./release-assets
